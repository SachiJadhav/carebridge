"Kitchen and sharp-edge safety":"Use a cutting board on a damp towel so it cannot slide. Keep knives sharp, since dull knives slip.\n\nPad sharp table corners with soft guards, and choose kitchen tools with big, grippy handles. Keep a phone within reach while you cook.",
"Carrying protection in public":"A personal safety alarm that clips to a bag is loud, legal in most places and needs no training. A flashlight and a charged phone with emergency contacts on speed dial also help.\n\nStay in well-lit areas, let someone know your plans, and check local rules before carrying anything else.",
"How to use a smartphone":"Press the side button to wake the phone. Tap an icon to open an app, and swipe up to go home.\n\nTo call, open Phone, tap the keypad, type the number and press the green button. Make text bigger in Settings under Display.",
"What is AI?":"AI, or artificial intelligence, is computer software that can read, write and answer questions in everyday language. It learns patterns from large amounts of text and images.\n\nIt can be helpful, but it can also be wrong, so double-check important facts.",

"Baked salmon with lemon":"Heat the oven to 400°F. Place salmon on foil, add lemon slices and a drizzle of olive oil, and bake 12 to 15 minutes until it flakes.\n\nServe with steamed green beans or rice.",
"What is the stock market?":"The stock market is a place where people buy and sell small pieces of companies, called shares. When a company does well, its shares can rise in value.\n\nPrices go up and down daily, so it works best as a long-term tool.",
"How to invest: the basics":"Start with an emergency fund, then consider spreading money across many holdings, such as index funds, instead of a single company.\n\nA fee-only financial advisor can help. This is general information, not personal advice.",
"Why investing matters":"Prices rise over time, so money sitting in a drawer buys less each year. Investing aims to help savings keep up with, or beat, rising costs.\n\nAll investing carries some risk of loss.",

document.addEventListener("click",ev=>{const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;

const md=s=>{let o="",ul=0;for(const l of s.split("\n")){const m=l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/),h=l.match(/^#+\s+(.*)/);if(ul&&!m){o+="</ul>";ul=0}if(h)o+=`<h2>${e(h[1])}</h2>`;else if(m){if(!ul){o+="<ul>";ul=1}o+=`<li>${e(m[1])}</li>`}else if(l.trim())o+=`<p>${e(l)}</p>`}return o+(ul?"</ul>":"")};
async function loadArt(k){const b=$("#ab");if(!b||!SM)return;const key=S.lang+k;b.setAttribute("data-nt","");if(AC[key]){b.innerHTML=AC[key];return}
b.innerHTML="<p class=muted>…</p>";const cur="a:"+k;

catch(x){const c=$("#ab");if(c&&S.p===cur){c.removeAttribute("data-nt");c.innerHTML=lines(ART[k]);if(x&&x.code==="not_granted")SM=null;lang()}}}
async function lang(){if(S.lang==="en"||!SM)return;if(busy){again=1;return}busy=1;
try{const items=[],w=document.createTreeWalker($("#wrap"),NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("[data-nt],script,style")||!/\p{L}/u.test(n.nodeValue)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});

items.forEach(i=>{const s=i.g(),v=TC[S.lang+"|"+s];if(v&&v!==s)i.s(v)})}
finally{busy=0;if(again){again=0;setTimeout(lang,50)}}}
